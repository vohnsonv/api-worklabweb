version: '3.8'

services:
  api-worklabweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-worklabweb-service
    restart: always
    env_file: .env
    environment:
      - PORT=3000
      - DB_PATH=/app/data/worklab.db
      - STORAGE_PATH=/app/data/laudos
    volumes:
      - ./data:/app/data
    networks:
      - proxy
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Redirecionamento HTTP -> HTTPS
      - "traefik.http.routers.worklab-http.rule=Host(`worklab.saltda.com`)"
      - "traefik.http.routers.worklab-http.entrypoints=web"
      - "traefik.http.routers.worklab-http.middlewares=worklab-https-redirect"
      - "traefik.http.middlewares.worklab-https-redirect.redirectscheme.scheme=https"
      # Rota HTTPS com Let's Encrypt
      - "traefik.http.routers.worklab.rule=Host(`worklab.saltda.com`)"
      - "traefik.http.routers.worklab.entrypoints=websecure"
      - "traefik.http.routers.worklab.tls=true"
      - "traefik.http.routers.worklab.tls.certresolver=letsencrypt"
      - "traefik.http.services.worklab.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
  shared-net:
    external: true
